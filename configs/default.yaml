# path to the task data directory
llm_config: configs/llm.yaml
data_dir: "data"
preprocess_data: False

goal: null
eval: null

log_dir: logs
workspace_dir: workspaces

# whether to copy the data to the workspace directory (otherwise it will be symlinked)
# copying is recommended to prevent the agent from accidentally modifying the original data
copy_data: True

exp_name: run # a random experiment name will be generated if not provided

# settings for code execution
exec:
  timeout: 3600
  agent_file_name: runfile.py
  format_tb_ipython: False
  # where experiment code runs:
  #   local - on this machine (needs a CUDA GPU for anything non-trivial)
  #   colab - on a Google Colab GPU via notebooks/colab_gpu_executor.ipynb
  #           (connection details in remote_executor.json)
  backend: local
  remote_max_file_mb: 100    # files larger than this are not synced back from Colab
  remote_wait_minutes: 60    # how long to wait for Colab to come back after a disconnect

generate_report: True
# LLM settings for final report from journal
report:
  model: router/summary
  temp: 1.0

experiment:
  num_syn_datasets: 1

debug:
  stage4: False

# agent hyperparams
# Legacy concrete Codex overrides only; routed profiles have per-call effort.
codex_reasoning_effort: low
agent:
  orchestrator: {model: router/orchestrator, temp: 0.2}
  type: parallel
  num_workers: 1
  stages:
    stage1_max_iters: 20
    stage2_max_iters: 12
    stage3_max_iters: 12
    stage4_max_iters: 18
  # how many improvement iterations to run
  steps: 5 # if stage-specific max_iters are not provided, the agent will use this value for all stages
  # whether to instruct the agent to use CV (set to 1 to disable)
  k_fold_validation: 1
  multi_seed_eval:
    num_seeds: 3 # should be the same as num_workers if num_workers < 3. Otherwise, set it to be 3.
  # whether to instruct the agent to generate a prediction function
  expose_prediction: False
  # whether to provide the agent with a preview of the data
  data_preview: False

  # LLM settings for coding
  code:
    model: router/code
    temp: 1.0
    max_tokens: 12000

  # LLM settings for evaluating program output / tracebacks
  feedback:
    model: router/feedback
    temp: 0.5
    max_tokens: 8192

  vlm_feedback:
    model: router/vision
    temp: 0.5
    max_tokens: null

  search:
    max_debug_depth: 3
    debug_prob: 0.5
    num_drafts: 3

  summary:
    model: router/summary
    temp: 0.3

  select_node:
    model: router/orchestrator
    temp: 0.3
