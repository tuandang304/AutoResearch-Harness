# Explicit model: do not pass --provider codex (it selects the CLI default).
data_dir: data
preprocess_data: false
goal: null
eval: null
log_dir: logs
workspace_dir: workspaces
copy_data: true
exp_name: run
exec:
  timeout: 600
  agent_file_name: runfile.py
  format_tb_ipython: false
  backend: colab
  remote_max_file_mb: 25
  remote_wait_minutes: 2
generate_report: false
report: {model: codex/gpt-6-sol, temp: 0.2}
experiment: {num_syn_datasets: 1}
debug: {stage4: false}
agent:
  type: parallel
  num_workers: 1
  max_stages: 1
  steps: 2
  stages:
    stage1_max_iters: 2
    stage2_max_iters: 1
    stage3_max_iters: 1
    stage4_max_iters: 1
  k_fold_validation: 1
  multi_seed_eval: {num_seeds: 1}
  expose_prediction: false
  data_preview: false
  code: {model: codex/gpt-6-sol, temp: 0.2, max_tokens: 12000}
  feedback: {model: codex/gpt-6-sol, temp: 0.2, max_tokens: 4096}
  vlm_feedback: {model: codex/gpt-6-sol, temp: 0.2, max_tokens: 4096}
  summary: {model: codex/gpt-6-sol, temp: 0.2}
  select_node: {model: codex/gpt-6-sol, temp: 0.2}
  search: {max_debug_depth: 1, debug_prob: 1.0, num_drafts: 1}
